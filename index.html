<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Twist Trivia — Unit 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1B1140;
    --bg2:#3C1361;
    --pink:#FF4D8D;
    --yellow:#FFD23F;
    --teal:#2FE6C9;
    --cream:#FFF8EC;
    --ink:#241442;
    --ink-soft:#4A3A78;
    --violet:#7B5CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 10%, rgba(255,77,141,0.25), transparent 40%),
      radial-gradient(circle at 88% 15%, rgba(47,230,201,0.20), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,210,63,0.15), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:26px 14px 70px;
    overflow-x:hidden;
    position:relative;
  }
  #app{width:100%; max-width:860px; position:relative; z-index:2;}

  /* ===== HEADER / PORTAL ===== */
  .masthead{
    text-align:center;
    margin-bottom:22px;
    position:relative;
  }
  .portal{
    width:96px; height:96px;
    margin:0 auto 6px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--pink), var(--yellow), var(--teal), var(--violet), var(--pink));
    animation: spin 6s linear infinite;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(255,77,141,0.45);
  }
  .portal::after{
    content:"⏱";
    display:flex; align-items:center; justify-content:center;
    width:70px; height:70px;
    background:var(--cream);
    border-radius:50%;
    font-size:32px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .masthead .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing:3px;
    font-size:11px;
    color:var(--yellow);
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(34px,7vw,52px);
    color:var(--cream);
    margin:4px 0 2px;
    text-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  .masthead .subline{
    color:var(--teal);
    font-weight:700;
    font-size:14px;
  }

  /* ===== CARD ===== */
  .card{
    background:var(--cream);
    border-radius:26px;
    padding:26px 24px;
    position:relative;
    box-shadow:0 20px 0 rgba(0,0,0,0.18), 0 24px 50px rgba(0,0,0,0.35);
    border:3px solid var(--ink);
  }
  .card.shake{ animation: shake .4s ease; }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:12px;
    color:var(--ink);
  }
  .badge.A{background:var(--pink); color:#fff;}
  .badge.B{background:var(--teal);}
  .badge.C{background:var(--yellow);}

  h2.headline{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 6px;
    line-height:1.25;
  }
  p.lede{ font-size:15px; line-height:1.5; margin:0 0 16px; color:var(--ink-soft); font-weight:600; }

  /* ===== SETUP SCREEN ===== */
  .section-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    margin:20px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .num{
    background:var(--ink); color:var(--cream);
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-family:'Space Mono', monospace;
  }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .cat-card{
    border:3px solid var(--ink);
    border-radius:16px;
    padding:14px 10px;
    text-align:center;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    background:#fff;
    transition:transform .12s ease;
    user-select:none;
  }
  .cat-card .emoji{font-size:26px; display:block; margin-bottom:4px;}
  .cat-card small{display:block; font-family:'Nunito',sans-serif; font-weight:600; font-size:11px; margin-top:3px; color:var(--ink-soft);}
  .cat-card.on{transform:translateY(-3px);}
  .cat-card.on.A{background:var(--pink); color:#fff;}
  .cat-card.on.B{background:var(--teal);}
  .cat-card.on.C{background:var(--yellow);}

  .stepper-row{ display:flex; align-items:center; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
  .stepper{ display:flex; align-items:center; gap:12px; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:6px 10px;}
  .stepper button{
    width:32px; height:32px; border-radius:50%;
    border:none; background:var(--ink); color:var(--cream);
    font-size:18px; cursor:pointer; font-family:'Space Mono', monospace;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper button:hover{background:var(--violet);}
  .stepper .val{ font-family:'Space Mono', monospace; font-weight:700; font-size:16px; min-width:22px; text-align:center;}
  .stepper-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; }

  .total-pill{
    display:inline-block; margin-top:8px; margin-bottom:6px;
    background:var(--ink); color:var(--cream);
    font-family:'Space Mono', monospace; font-size:13px;
    padding:8px 16px; border-radius:999px;
  }

  .team-row{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .team-dot{ width:16px; height:16px; border-radius:50%; flex-shrink:0; border:2px solid var(--ink);}
  .team-name-input{
    font-family:'Nunito', sans-serif; font-weight:700; font-size:14px;
    padding:8px 10px; border:2px solid var(--ink-soft); border-radius:10px; flex:1; background:#fff;
  }

  .btn-primary{
    display:inline-block;
    background:var(--pink);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 28px;
    border:3px solid var(--ink);
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--ink);
    transition:transform .08s ease;
  }
  .btn-primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-secondary{
    display:inline-block;
    background:#fff;
    color:var(--ink);
    border:3px solid var(--ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    margin-left:10px;
    box-shadow:0 5px 0 var(--ink-soft);
  }
  .btn-secondary:active{transform:translateY(4px); box-shadow:none;}

  .warn{ font-size:12px; color:#B33A3A; font-weight:700; margin-top:6px; }

  /* ===== GAME STATUS BAR ===== */
  .status-bar{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px; margin-bottom:14px;
  }
  .progress-pill{
    font-family:'Space Mono', monospace;
    background:var(--ink);
    color:var(--yellow);
    padding:7px 14px;
    border-radius:999px;
    font-size:12px;
  }
  .scores{ display:flex; gap:8px; flex-wrap:wrap; }
  .score-chip{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.15);
    color:var(--cream);
    border:2px solid rgba(255,255,255,0.3);
    transition:transform .2s ease;
  }
  .score-chip.turn{
    background:var(--yellow); color:var(--ink); border-color:var(--ink); font-weight:700;
  }
  .score-chip.pop{ animation:pop .4s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);} }

  /* ===== OPTIONS ===== */
  .options{ display:flex; flex-direction:column; gap:10px; margin:16px 0 6px; }
  .option{
    text-align:left;
    background:#fff;
    border:3px solid var(--ink-soft);
    border-radius:14px;
    padding:13px 16px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:border-color .1s ease, transform .08s ease, background .1s ease;
  }
  .option:hover{ border-color:var(--violet); transform:translateX(2px); }
  .option.correct{ background:rgba(47,230,201,0.35); border-color:var(--teal); }
  .option.incorrect{ background:rgba(255,77,141,0.25); border-color:var(--pink); }
  .option[disabled]{ cursor:default; }

  .explain{
    margin-top:14px; font-size:14px; font-weight:600; color:var(--ink-soft);
    border-left:4px solid var(--yellow); padding-left:10px;
  }

  /* ===== ORDERING ===== */
  .sentence-box{
    min-height:58px; background:#fff; border:3px dashed var(--ink-soft);
    border-radius:16px; padding:12px; display:flex; flex-wrap:wrap; gap:6px;
    align-items:center; margin-bottom:14px;
  }
  .sentence-box .placeholder{ font-family:'Space Mono', monospace; font-size:12px; color:#999; }
  .chip-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{
    background:var(--cream); border:2px solid var(--ink-soft); padding:9px 13px;
    border-radius:999px; font-family:'Nunito', sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; user-select:none; transition:transform .08s ease;
  }
  .chip:hover{ background:var(--yellow); transform:translateY(-2px); }
  .chip.used{ opacity:0.3; cursor:default; }
  .chip.placed{ background:var(--violet); color:#fff; border-color:var(--ink); cursor:pointer; }

  .stamp{
    position:absolute; top:14px; right:16px;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px;
    letter-spacing:1px; text-transform:uppercase;
    padding:8px 14px; border-radius:14px;
    transform:rotate(-6deg);
    animation: stamp-in .35s ease;
  }
  .stamp.ok{ background:var(--teal); color:var(--ink); }
  .stamp.no{ background:var(--pink); color:#fff; }
  @keyframes stamp-in{
    0%{ transform:scale(2.2) rotate(-6deg); opacity:0; }
    60%{ transform:scale(0.9) rotate(-6deg); opacity:1; }
    100%{ transform:scale(1) rotate(-6deg); opacity:1; }
  }

  .foot-actions{ margin-top:20px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }

  .summary-table{ width:100%; border-collapse:collapse; margin:16px 0; font-family:'Space Mono', monospace; font-size:13px; }
  .summary-table th, .summary-table td{ border-bottom:2px solid var(--ink-soft); padding:9px 6px; text-align:left; }
  .winner-banner{
    font-family:'Baloo 2', sans-serif; font-size:24px; font-weight:800; color:var(--pink); margin-bottom:8px;
  }
  small.hint{ display:block; margin-top:6px; color:var(--ink-soft); font-size:12px; font-weight:700; }

  #confetti-layer{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;
  }
  .confetti-piece{
    position:absolute; top:-20px; width:9px; height:14px; opacity:0.95;
    animation: confetti-fall 1.1s ease-in forwards;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(105vh) rotate(600deg); opacity:0; }
  }

  @media (max-width:560px){
    .cat-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="confetti-layer"></div>
<div id="app">
  <div class="masthead">
    <div class="portal"></div>
    <div class="eyebrow">Unit 4 · Grammar Game Show</div>
    <h1>Time Twist Trivia</h1>
    <div class="subline">Simple past · Past continuous · Past perfect</div>
  </div>
  <div id="screen-root"></div>
</div>

<script>
/* ================= DATA ================= */

const triviaBank = [
  {p:"The Wright brothers ___ (fly) the first airplane in 1903.", o:["flew","were flying","had flown","fly"], c:0, e:"A one-time historical event takes the simple past."},
  {p:"Isaac Newton ___ (discover) the laws of motion in the 17th century.", o:["was discovering","discovered","had discovered","discovers"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"Neil Armstrong ___ (become) the first person to walk on the Moon in 1969.", o:["became","was becoming","had become","becomes"], c:0, e:"A single completed event takes the simple past."},
  {p:"Marie Curie ___ (research) radioactivity when she ___ (discover) polonium.", o:["researched / had discovered","was researching / discovered","had researched / discovers","researches / discovered"], c:1, e:"An action in progress is interrupted by a shorter action: past continuous + past simple."},
  {p:"By the time the Titanic hit the iceberg, it ___ (sail) for four days.", o:["sailed","was sailing","had sailed","sails"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"Albert Einstein ___ (publish) his theory of relativity in 1905.", o:["had published","published","was publishing","publishes"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"Rosa Parks ___ (refuse) to give up her seat on a bus in 1955.", o:["refused","was refusing","had refused","refuses"], c:0, e:"A single completed action takes the simple past."},
  {p:"Before Rosa Parks refused to give up her seat, other activists ___ (try) similar protests.", o:["tried","were trying","had tried","try"], c:2, e:"An earlier past action uses the past perfect."},
  {p:"Alexander Graham Bell ___ (invent) the telephone in 1876.", o:["was inventing","had invented","invents","invented"], c:3, e:"A completed historical fact takes the simple past."},
  {p:"While Alexander Fleming ___ (study) bacteria, he ___ (notice) an unusual mold.", o:["studied / had noticed","was studying / noticed","had studied / was noticing","studies / noticed"], c:1, e:"An action in progress is interrupted by a shorter action: past continuous + past simple."},
  {p:"The ancient Egyptians ___ (build) the pyramids thousands of years ago.", o:["built","were building","had built","build"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"Christopher Columbus ___ (arrive) in America in 1492.", o:["was arriving","had arrived","arrived","arrives"], c:2, e:"A completed historical fact takes the simple past."},
  {p:"By the time Columbus arrived, Vikings ___ already ___ (visit) the continent.", o:["visited","were visiting","had already visited","visit"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"Leonardo da Vinci ___ (paint) the Mona Lisa in the early 1500s.", o:["painted","was painting","had painted","paints"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"William Shakespeare ___ (write) Romeo and Juliet in the 1590s.", o:["was writing","wrote","had written","writes"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"The Great Wall of China ___ (take) centuries to build.", o:["took","was taking","had taken","takes"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"Thomas Edison ___ already ___ (test) thousands of materials when he finally found one that worked.", o:["tested","was testing","had already tested","tests"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"The dinosaurs ___ (disappear) about 66 million years ago.", o:["were disappearing","disappeared","had disappeared","disappear"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"The Apollo 11 astronauts ___ (walk) on the Moon while millions of people ___ (watch) on TV.", o:["walked / watched","were walking / were watching","had walked / watched","walk / were watching"], c:1, e:"Two long actions happening at the same time both take the past continuous."},
  {p:"Charles Darwin ___ (develop) his theory of evolution after his voyage on the Beagle.", o:["was developing","had developed","developed","develops"], c:2, e:"A completed historical fact takes the simple past."},
  {p:"J.K. Rowling ___ (travel) on a delayed train when she ___ (get) the idea for Harry Potter.", o:["traveled / had gotten","was traveling / got","had traveled / was getting","travels / got"], c:1, e:"An action in progress is interrupted by a shorter action: past continuous + past simple."},
  {p:"The Berlin Wall ___ (fall) in 1989.", o:["was falling","had fallen","fell","falls"], c:2, e:"A completed historical fact takes the simple past."},
  {p:"By 1989, the Berlin Wall ___ (divide) the city for nearly three decades.", o:["divided","was dividing","had divided","divides"], c:2, e:"This happened before another past moment, so we use the past perfect."},
  {p:"Nelson Mandela ___ already ___ (spend) 27 years in prison before he became president.", o:["spent","was spending","had already spent","spends"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"The first modern Olympic Games ___ (take) place in Athens in 1896.", o:["took","were taking","had taken","take"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"Vincent van Gogh ___ (paint) Starry Night in 1889.", o:["was painting","painted","had painted","paints"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"While van Gogh ___ (live) in France, he ___ (create) some of his most famous works.", o:["lived / had created","was living / created","had lived / was creating","lives / created"], c:1, e:"A background action (was living) and a shorter completed action (created)."},
  {p:"The Beatles ___ (release) their first album in 1963.", o:["released","were releasing","had released","release"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"People ___ (buy) music on CDs before streaming became popular.", o:["were buying","had bought","bought","buy"], c:2, e:"A general past habit/fact takes the simple past."},
  {p:"Edmund Hillary and Tenzing Norgay ___ (reach) the summit of Mount Everest in 1953.", o:["reached","were reaching","had reached","reach"], c:0, e:"A completed historical fact takes the simple past."},
  {p:"When they reached the summit, no one else ___ ever ___ (climb) it before.", o:["climbed","was climbing","had ever climbed","climbs"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"The first iPhone ___ (launch) in 2007.", o:["was launching","launched","had launched","launches"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"Steve Jobs and his team ___ already ___ (work) on the iPhone for years before Apple released it.", o:["worked","were working","had already worked","work"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"Amelia Earhart ___ (disappear) during a flight across the Pacific in 1937.", o:["was disappearing","disappeared","had disappeared","disappears"], c:1, e:"A completed historical event takes the simple past."},
  {p:"She ___ (attempt) to fly around the world when her plane vanished.", o:["attempted","was attempting","had attempted","attempts"], c:1, e:"An action in progress is interrupted by a shorter action: past continuous + past simple."},
  {p:"The Wright brothers ___ many failed experiments before they finally flew successfully.", o:["conducted","were conducting","had conducted","conduct"], c:2, e:"This happened before another past event, so we use the past perfect."},
  {p:"World War I ___ (begin) in 1914.", o:["was beginning","began","had begun","begins"], c:1, e:"A completed historical fact takes the simple past."},
  {p:"By 1918, millions of soldiers ___ (lose) their lives.", o:["lost","were losing","had lost","lose"], c:2, e:"This happened before another past moment, so we use the past perfect."},
  {p:"Tim Berners-Lee ___ (invent) the World Wide Web in 1989.", o:["was inventing","had invented","invented","invents"], c:2, e:"A completed historical fact takes the simple past."},
  {p:"Scientists ___ already ___ (study) the stars for centuries before they understood how galaxies form.", o:["studied","were studying","had already studied","study"], c:2, e:"This happened before another past event, so we use the past perfect."}
];

const verbTriples = [
  ["go","went","gone"],["see","saw","seen"],["eat","ate","eaten"],["take","took","taken"],
  ["break","broke","broken"],["write","wrote","written"],["speak","spoke","spoken"],["begin","began","begun"],
  ["come","came","come"],["give","gave","given"],["know","knew","known"],["drive","drove","driven"],
  ["choose","chose","chosen"],["drink","drank","drunk"],["fly","flew","flown"],["forget","forgot","forgotten"],
  ["freeze","froze","frozen"],["grow","grew","grown"],["hide","hid","hidden"],["ride","rode","ridden"],
  ["ring","rang","rung"],["rise","rose","risen"],["shake","shook","shaken"],["sing","sang","sung"],
  ["sink","sank","sunk"],["steal","stole","stolen"],["swim","swam","swum"],["tear","tore","torn"],
  ["throw","threw","thrown"],["wake","woke","woken"],["wear","wore","worn"],["win","won","won"],
  ["blow","blew","blown"],["catch","caught","caught"],["draw","drew","drawn"],["fall","fell","fallen"],
  ["feel","felt","felt"],["find","found","found"],["fight","fought","fought"],["hear","heard","heard"],
  ["hold","held","held"],["keep","kept","kept"],["leave","left","left"],["lose","lost","lost"],
  ["meet","met","met"]
];

const orderingBank = [
  {a:"I was cooking dinner when the phone rang.", h:"past continuous + past simple"},
  {a:"She had already left when I arrived.", h:"past perfect + past simple"},
  {a:"They visited Paris last summer.", h:"past simple"},
  {a:"We were watching a movie while it was raining.", h:"past continuous (both actions)"},
  {a:"By the time the train arrived, we had waited for two hours.", h:"past simple + past perfect"},
  {a:"He was driving to work when he saw the accident.", h:"past continuous + past simple"},
  {a:"I had never tried sushi before that trip.", h:"past perfect"},
  {a:"The kids were playing outside when it started to rain.", h:"past continuous + past simple"},
  {a:"My parents got married in 1995.", h:"past simple"},
  {a:"She was reading a book when the lights went out.", h:"past continuous + past simple"},
  {a:"We had finished dinner before the guests arrived.", h:"past perfect + past simple"},
  {a:"He broke his leg while he was skiing last winter.", h:"past simple + past continuous"},
  {a:"I had already eaten when they invited me to lunch.", h:"past perfect + past simple"},
  {a:"The team celebrated after they won the championship.", h:"past simple"},
  {a:"She was talking on the phone when I walked in.", h:"past continuous + past simple"},
  {a:"By the time I got home, my brother had cleaned the kitchen.", h:"past simple + past perfect"},
  {a:"They were traveling in Europe when the pandemic began.", h:"past continuous + past simple"},
  {a:"I forgot my umbrella at the office yesterday.", h:"past simple"},
  {a:"We had never seen snow before we moved to Canada.", h:"past perfect + past simple"},
  {a:"He was cooking breakfast when the smoke alarm went off.", h:"past continuous + past simple"},
  {a:"The movie had already started when we found our seats.", h:"past perfect + past simple"},
  {a:"I woke up early and went for a run.", h:"past simple"},
  {a:"She was studying for her exam when her friends called.", h:"past continuous + past simple"},
  {a:"We had planned the trip for months before we finally left.", h:"past perfect + past simple"},
  {a:"The dog was barking loudly when the mailman arrived.", h:"past continuous + past simple"},
  {a:"I had lost my keys before I found them under the couch.", h:"past perfect + past simple"},
  {a:"They were dancing all night at the wedding.", h:"past continuous"},
  {a:"By the time she called, I had already gone to bed.", h:"past simple + past perfect"},
  {a:"He forgot his lines while he was performing on stage.", h:"past simple + past continuous"},
  {a:"We had booked the tickets before the prices went up.", h:"past perfect + past simple"},
  {a:"I was walking home when I saw an old friend.", h:"past continuous + past simple"},
  {a:"She had studied French for years before she moved to Paris.", h:"past perfect + past simple"},
  {a:"The children were building a sandcastle when the tide came in.", h:"past continuous + past simple"},
  {a:"We had just sat down when the waiter brought the menus.", h:"past perfect + past simple"},
  {a:"He was jogging in the park when it began to rain.", h:"past continuous + past simple"}
];

const CATEGORY_META = {
  A: {name:"Trivia Challenge", emoji:"🌍", tip:"General knowledge + grammar"},
  B: {name:"Verb Vault", emoji:"📖", tip:"Past simple & past participle"},
  C: {name:"Sentence Builder", emoji:"🧩", tip:"Put the words in order"}
};

const TEAM_COLORS = ["#FF4D8D","#2FE6C9","#FFD23F","#7B5CFF","#FF8A3D","#5CD6FF"];

/* ================= HELPERS ================= */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildVerbQuestion(triple){
  const [base,past,participle] = triple;
  const correctStr = base+" – "+past+" – "+participle;
  const candidates = [
    base+" – "+past+" – "+past,
    base+" – "+participle+" – "+past,
    base+" – "+base+"ed – "+base+"ed",
    base+" – "+base+"ed – "+participle,
    base+" – "+past+" – "+base+"ed",
    base+" – "+participle+" – "+participle,
    base+" – "+base+" – "+base
  ];
  const distractors = [];
  for(const cand of candidates){
    if(cand !== correctStr && distractors.indexOf(cand) === -1){
      distractors.push(cand);
    }
    if(distractors.length === 3) break;
  }
  const opts = shuffle([correctStr, ...distractors]);
  return {
    type:"mcq",
    cat:"B",
    title: base.toUpperCase(),
    subtitle:"Pick the row with the correct past simple and past participle.",
    options: opts,
    correct: opts.indexOf(correctStr),
    explain: "Correct form: "+correctStr+"."
  };
}

function buildTriviaQuestion(item){
  return {
    type:"mcq",
    cat:"A",
    title: item.p,
    subtitle:null,
    options: item.o,
    correct: item.c,
    explain: item.e
  };
}

function buildOrderQuestion(item){
  return {
    type:"order",
    cat:"C",
    answer: item.a,
    hint: item.h
  };
}

function spawnConfetti(){
  const layer = document.getElementById("confetti-layer");
  const colors = [TEAM_COLORS[0],TEAM_COLORS[1],TEAM_COLORS[2],TEAM_COLORS[3]];
  for(let i=0;i<26;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (Math.random()*100)+"vw";
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = (Math.random()*0.2)+"s";
    piece.style.borderRadius = Math.random()>0.5 ? "50%" : "2px";
    layer.appendChild(piece);
    setTimeout(()=>piece.remove(), 1400);
  }
}

/* ================= STATE ================= */

let state = {
  screen:"home",
  selectedCats:{A:true, B:true, C:true},
  rounds:3,
  perRound:6,
  numTeams:2,
  teamNames:["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6"],
  scores:[0,0,0,0,0,0],
  turn:0,
  roundsPlan:[],
  roundIndex:0,
  qIndex:0,
  answered:false,
  pool:[],
  placed:[],
  poppedChip:-1
};

function selectedCatList(){
  return ["A","B","C"].filter(k=>state.selectedCats[k]);
}

function buildRoundsPlan(){
  const cats = selectedCatList();
  const decks = {
    A: shuffle(triviaBank).map(buildTriviaQuestion),
    B: shuffle(verbTriples).map(buildVerbQuestion),
    C: shuffle(orderingBank).map(buildOrderQuestion)
  };
  const pointers = {A:0,B:0,C:0};
  const plan = [];
  for(let r=0;r<state.rounds;r++){
    const cat = cats[r % cats.length];
    const deck = decks[cat];
    const available = deck.length - pointers[cat];
    const count = Math.max(0, Math.min(state.perRound, available));
    const qs = deck.slice(pointers[cat], pointers[cat]+count);
    pointers[cat] += count;
    plan.push({cat, questions:qs});
  }
  return plan.filter(r=>r.questions.length>0);
}

function startGame(){
  state.roundsPlan = buildRoundsPlan();
  state.roundIndex = 0;
  state.qIndex = 0;
  state.turn = 0;
  state.scores = [0,0,0,0,0,0];
  state.answered = false;
  if(state.roundsPlan.length === 0){ return; }
  setupQuestionExtras();
  state.screen = "playing";
  render();
}

function setupQuestionExtras(){
  const q = currentQuestion();
  if(q && q.type === "order"){
    const tokens = q.answer.split(" ");
    state.pool = shuffle(tokens).map((t,i)=>({text:t, id:i, used:false}));
    state.placed = [];
  }
}

function currentRound(){ return state.roundsPlan[state.roundIndex]; }
function currentQuestion(){
  const r = currentRound();
  return r ? r.questions[state.qIndex] : null;
}

function nextTurn(){ state.turn = (state.turn + 1) % state.numTeams; }

function nextQuestion(){
  state.answered = false;
  const total = currentRound().questions.length;
  state.qIndex++;
  nextTurn();
  if(state.qIndex >= total){
    if(state.roundIndex < state.roundsPlan.length - 1){
      state.screen = "roundEnd";
    } else {
      state.screen = "summary";
    }
  } else {
    setupQuestionExtras();
    state.screen = "playing";
  }
  render();
}

function advanceRound(){
  state.roundIndex++;
  state.qIndex = 0;
  setupQuestionExtras();
  state.screen = "playing";
  render();
}

/* ================= RENDER ================= */

function render(){
  const root = document.getElementById("screen-root");
  if(state.screen === "home") root.innerHTML = renderHome();
  else if(state.screen === "playing") root.innerHTML = renderPlaying();
  else if(state.screen === "roundEnd") root.innerHTML = renderRoundEnd();
  else if(state.screen === "summary") root.innerHTML = renderSummary();
  attachHandlers();
}

function renderHome(){
  const catsOk = selectedCatList().length > 0;
  const total = state.rounds * state.perRound;
  return `
  <div class="card">
    <div class="section-title"><span class="num">1</span> Pick your categories</div>
    <div class="cat-grid">
      ${["A","B","C"].map(k=>`
        <div class="cat-card ${state.selectedCats[k]?'on '+k:''}" data-cat="${k}">
          <span class="emoji">${CATEGORY_META[k].emoji}</span>
          ${CATEGORY_META[k].name}
          <small>${CATEGORY_META[k].tip}</small>
        </div>
      `).join("")}
    </div>
    ${!catsOk ? '<div class="warn">Pick at least one category!</div>' : ''}

    <div class="section-title"><span class="num">2</span> Rounds &amp; questions</div>
    <div class="stepper-row">
      <div class="stepper-label">Rounds</div>
      <div class="stepper">
        <button data-action="dec-rounds">−</button>
        <span class="val">${state.rounds}</span>
        <button data-action="inc-rounds">+</button>
      </div>
      <div class="stepper-label">Questions / round</div>
      <div class="stepper">
        <button data-action="dec-perround">−</button>
        <span class="val">${state.perRound}</span>
        <button data-action="inc-perround">+</button>
      </div>
    </div>
    <div class="total-pill">🎯 Total questions this game: ${total}</div>

    <div class="section-title"><span class="num">3</span> Teams</div>
    <div class="stepper-row">
      <div class="stepper-label">Number of teams</div>
      <div class="stepper">
        <button data-action="dec-team">−</button>
        <span class="val">${state.numTeams}</span>
        <button data-action="inc-team">+</button>
      </div>
    </div>
    ${Array.from({length:state.numTeams}).map((_,i)=>`
      <div class="team-row">
        <span class="team-dot" style="background:${TEAM_COLORS[i]}"></span>
        <input class="team-name-input" data-team-input="${i}" value="${state.teamNames[i]}">
      </div>
    `).join("")}

    <div class="foot-actions">
      <button class="btn-primary" id="start-btn" ${catsOk?'':'disabled'}>🚀 Start the game!</button>
    </div>
  </div>
  `;
}

function statusBar(){
  const r = currentRound();
  const total = r.questions.length;
  const meta = CATEGORY_META[r.cat];
  return `
  <div class="status-bar">
    <div class="progress-pill">${meta.emoji} Round ${state.roundIndex+1}/${state.roundsPlan.length} · Q${state.qIndex+1}/${total}</div>
    <div class="scores">
      ${Array.from({length:state.numTeams}).map((_,i)=>`
        <div class="score-chip ${i===state.turn?'turn':''} ${state.poppedChip===i?'pop':''}" style="${i===state.turn?'':'border-color:'+TEAM_COLORS[i]+'55'}">${state.teamNames[i]}: ${state.scores[i]}</div>
      `).join("")}
    </div>
  </div>`;
}

function renderPlaying(){
  const q = currentQuestion();
  if(!q) return statusBar() + `<div class="card"><p class="lede">No more questions in this round.</p></div>`;
  if(q.type === "mcq") return statusBar() + renderMcq(q);
  return statusBar() + renderOrder(q);
}

function renderMcq(q){
  const meta = CATEGORY_META[q.cat];
  return `
  <div class="card ${state.answered && !state.lastCorrect ? 'shake':''}">
    ${state.answered ? `<div class="stamp ${state.lastCorrect?'ok':'no'}">${state.lastCorrect?'✔ Correct!':'✖ Nope'}</div>`:''}
    <div class="badge ${q.cat}">${meta.emoji} ${meta.name}</div>
    <div style="font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px;">${state.teamNames[state.turn]}'s turn</div>
    <h2 class="headline">${q.title}</h2>
    ${q.subtitle ? `<p class="lede">${q.subtitle}</p>` : ''}
    <div class="options">
      ${q.options.map((opt,i)=>`
        <button class="option ${state.answered && i===q.correct ? 'correct':''} ${state.answered && i===state.selected && i!==q.correct ? 'incorrect':''}" data-opt="${i}" ${state.answered?'disabled':''}>${opt}</button>
      `).join("")}
    </div>
    ${state.answered ? `<div class="explain">${q.explain}</div>`:''}
    <div class="foot-actions">
      ${state.answered ? `<button class="btn-primary" id="next-btn">Next question →</button>` : ''}
    </div>
  </div>`;
}

function renderOrder(q){
  const meta = CATEGORY_META[q.cat];
  return `
  <div class="card ${state.answered && !state.lastCorrect ? 'shake':''}">
    ${state.answered ? `<div class="stamp ${state.lastCorrect?'ok':'no'}">${state.lastCorrect?'✔ Correct!':'✖ Nope'}</div>`:''}
    <div class="badge ${q.cat}">${meta.emoji} ${meta.name}</div>
    <div style="font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px;">${state.teamNames[state.turn]}'s turn</div>
    <h2 class="headline">Put the words in order</h2>
    <p class="lede">Hint: ${q.hint}</p>
    <div class="sentence-box" id="sentence-box">
      ${state.placed.length===0 ? '<span class="placeholder">— tap the words below to build the sentence here —</span>' :
        state.placed.map(pl=>`<span class="chip placed" data-remove="${pl.id}">${pl.text}</span>`).join("")}
    </div>
    <div class="chip-pool">
      ${state.pool.map(pl=>`<span class="chip ${pl.used?'used':''}" data-pick="${pl.id}">${pl.text}</span>`).join("")}
    </div>
    <div class="foot-actions">
      ${!state.answered ? `<button class="btn-primary" id="check-btn">Check ✅</button><button class="btn-secondary" id="clear-btn">Clear</button>` : ''}
      ${state.answered ? `<button class="btn-primary" id="next-btn">Next question →</button>` : ''}
    </div>
    ${state.answered && !state.lastCorrect ? `<div class="explain">The correct sentence was: "${q.answer}"</div>` : ''}
  </div>`;
}

function renderRoundEnd(){
  const finished = state.roundsPlan[state.roundIndex];
  const next = state.roundsPlan[state.roundIndex+1];
  return `
  <div class="card">
    <div class="badge ${finished.cat}">${CATEGORY_META[finished.cat].emoji} Round complete!</div>
    <h2 class="headline">${CATEGORY_META[finished.cat].name}: done ✔</h2>
    <p class="lede">Scoreboard before "${CATEGORY_META[next.cat].name}":</p>
    <div class="scores" style="margin-bottom:18px;">
      ${Array.from({length:state.numTeams}).map((_,i)=>`<div class="score-chip turn" style="background:${TEAM_COLORS[i]}; color:var(--ink);">${state.teamNames[i]}: ${state.scores[i]}</div>`).join("")}
    </div>
    <button class="btn-primary" id="advance-btn">Continue to ${CATEGORY_META[next.cat].emoji} ${CATEGORY_META[next.cat].name} →</button>
  </div>`;
}

function renderSummary(){
  const n = state.numTeams;
  const maxScore = Math.max(...state.scores.slice(0,n));
  const winners = state.teamNames.slice(0,n).filter((_,i)=>state.scores[i]===maxScore);
  return `
  <div class="card">
    <div class="badge A">🏆 Game Over</div>
    <div class="winner-banner">${winners.length>1 ? "It's a tie between "+winners.join(" and ")+"!" : winners[0]+" wins the game!"}</div>
    <p class="lede">Final results:</p>
    <table class="summary-table">
      <tr><th>Team</th><th>Points</th></tr>
      ${Array.from({length:n}).map((_,i)=>`<tr><td>${state.teamNames[i]}</td><td>${state.scores[i]}</td></tr>`).join("")}
    </table>
    <div class="foot-actions">
      <button class="btn-primary" id="replay-btn">🔁 Play again</button>
    </div>
  </div>`;
}

/* ================= EVENTS ================= */

function attachHandlers(){
  const root = document.getElementById("screen-root");

  root.querySelectorAll("[data-cat]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const k = c.getAttribute("data-cat");
      state.selectedCats[k] = !state.selectedCats[k];
      render();
    });
  });

  const bind = (sel, fn) => { const e = root.querySelector(sel); if(e) e.addEventListener("click", fn); };
  bind('[data-action="dec-rounds"]', ()=>{ if(state.rounds>1){state.rounds--; render();} });
  bind('[data-action="inc-rounds"]', ()=>{ if(state.rounds<8){state.rounds++; render();} });
  bind('[data-action="dec-perround"]', ()=>{ if(state.perRound>3){state.perRound--; render();} });
  bind('[data-action="inc-perround"]', ()=>{ if(state.perRound<15){state.perRound++; render();} });
  bind('[data-action="dec-team"]', ()=>{ if(state.numTeams>1){state.numTeams--; render();} });
  bind('[data-action="inc-team"]', ()=>{ if(state.numTeams<6){state.numTeams++; render();} });

  root.querySelectorAll("[data-team-input]").forEach(inp=>{
    inp.addEventListener("input", (e)=>{
      const i = parseInt(inp.getAttribute("data-team-input"));
      state.teamNames[i] = e.target.value || ("Team "+(i+1));
    });
  });

  bind("#start-btn", startGame);

  root.querySelectorAll("[data-opt]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = parseInt(b.getAttribute("data-opt"));
      const q = currentQuestion();
      state.selected = i;
      state.lastCorrect = (i === q.correct);
      if(state.lastCorrect){ state.scores[state.turn]++; state.poppedChip = state.turn; spawnConfetti(); }
      state.answered = true;
      render();
      setTimeout(()=>{ state.poppedChip=-1; }, 450);
    });
  });
  bind("#next-btn", nextQuestion);

  root.querySelectorAll("[data-pick]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const id = parseInt(c.getAttribute("data-pick"));
      const item = state.pool.find(p=>p.id===id);
      if(item.used) return;
      item.used = true;
      state.placed.push(item);
      render();
    });
  });
  root.querySelectorAll("[data-remove]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const id = parseInt(c.getAttribute("data-remove"));
      state.placed = state.placed.filter(p=>p.id!==id);
      const item = state.pool.find(p=>p.id===id);
      item.used = false;
      render();
    });
  });
  bind("#check-btn", ()=>{
    const q = currentQuestion();
    const built = state.placed.map(p=>p.text).join(" ");
    state.lastCorrect = (built === q.answer);
    if(state.lastCorrect){ state.scores[state.turn]++; state.poppedChip = state.turn; spawnConfetti(); }
    state.answered = true;
    render();
    setTimeout(()=>{ state.poppedChip=-1; }, 450);
  });
  bind("#clear-btn", ()=>{
    state.placed = [];
    state.pool.forEach(p=>p.used=false);
    render();
  });

  bind("#advance-btn", advanceRound);
  bind("#replay-btn", ()=>{ state.screen="home"; render(); });
}

render();
</script>
</body>
</html>
